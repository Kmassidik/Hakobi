<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hakobi UI prototype</title>
<style>
:root{--bg:#f5f5f7;--surface:#fff;--ink:#18211d;--muted:#86868b;--line:#ececf0;--brand:#164f3b;--lime:#d8f078;--emerald:#10b981;--amber:#f59e0b;--danger:#a53c32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antiased}
.hidden{display:none!important}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(920px,100%);background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.08);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.login-brand{padding:38px;background:#0f382c;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.login-brand h1{font-size:34px;letter-spacing:-.04em;margin:8px 0}
.login-form{padding:38px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#d8f078}
.field{display:grid;gap:6px}
.field label{font-size:11px;font-weight:700;color:#57606a}
.input{width:100%;border:1px solid #e5e5ea;border-radius:10px;padding:11px 12px;background:#fff;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,79,59,.12)}
.primary{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px 14px;font-weight:700}
.ghost{background:#fff;border:1px solid #e5e5ea;border-radius:10px;padding:9px 12px;font-weight:600}
.app{min-height:100vh;display:grid;grid-template-columns:232px 1fr}
.sidebar{background:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:26px;min-height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em}
.mark{width:34px;height:34px;border-radius:10px;background:var(--lime);display:grid;place-items:center;color:var(--brand);font-weight:900}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:9px;color:#57606a;font-weight:600}
.nav button.active{background:#f1f1f4;color:#111;box-shadow:inset 3px 0 0 var(--brand)}
.nav .ico{width:18px;text-align:center}
.profile{margin-top:auto;background:var(--bg);border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.main{min-width:0;padding:30px 34px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#86868b;margin:0 0 7px}
h1{font-size:34px;letter-spacing:-.045em;margin:0;font-weight:650}
.sub{color:#68716c;margin-top:8px;max-width:760px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);min-width:0}
.grid{display:grid;gap:14px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.metric label{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#86868b}
.value{font-size:24px;font-weight:700;letter-spacing:-.04em;margin-top:7px}
.sub{font-size:11px;color:#86868b;margin-top:8px}
.metric-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.art{width:34px;height:34px;object-fit:contain}
.bar{height:5px;background:#ececf0;border-radius:99px;overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;background:var(--brand);border-radius:99px}
.progress{width:100%;height:6px;appearance:none;border:0;background:#ececf0;border-radius:99px;overflow:hidden}
.progress::-webkit-progress-value{background:var(--brand)}
.two{grid-template-columns:1fr 1fr}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:#86868b;font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:0 8px 9px 0;border-bottom:1px solid var(--line)}
td{padding:9px 8px 9px 0;border-bottom:1px solid #f3f3f6;color:#4b5563}
td.strong{color:var(--ink);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:9px;font-weight:800;padding:3px 6px;border-radius:5px;background:#ecfdf3;color:#087443}
.tag.warn{background:#fff7e6;color:#9a6700}
.tag.bad{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid #e5e5ea;background:#fff;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700}
.btn.brand{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.danger{color:var(--danger);border-color:#f3c8c3}
.btn:hover{filter:brightness(.97)}
.form-card{max-width:860px}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
textarea.input{min-height:180px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.cores{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.core{background:#f5f5f7;border-radius:6px;padding:5px}
.core small{display:block;color:#a1a1aa;font-size:8px;margin-bottom:3px}
.core .track{height:24px;background:#e9e9ee;border-radius:4px;overflow:hidden}
.core .fill{height:100%;background:linear-gradient(180deg,#2e7457,#164f3b)}
caption{text-align:left;font-size:11px;color:#86868b;padding-bottom:6px}
.empty{border:1px dashed #d8d8de;border-radius:12px;padding:28px;text-align:center;color:#68716c}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:7px 10px;font-size:11px;font-weight:700;color:#4b5563;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--emerald)}
.sample{background:#fff7e6;color:#9a6700}
.back{font-size:11px;font-weight:700;color:#68716c;text-decoration:none}
@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:22px}.metrics{grid-template-columns:1fr 1fr}.two,.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<section id="login" class="login">
  <div class="login-card">
    <div class="login-brand">
      <div>
        <div style="display:flex;align-items:center;gap:10px;font-weight:800">
          <span style="width:34px;height:34px;border-radius:10px;background:var(--lime);color:var(--brand);display:grid;place-items:center">運</span>
          Hakobi
        </div>
        <h1>Ship calmly.</h1>
        <p style="color:#c3d2ca;margin:0">Self-hosted delivery control plane.</p>
      </div>
      <img src="../static/assets/art/mascot/hako-carry.webp" alt="" style="width:72%;max-width:230px;align-self:center">
    </div>
    <form class="login-form" data-form="login">
      <span class="badge">UI prototype · sample data · no backend</span>
      <h2 style="margin:0;letter-spacing:-.03em">Welcome back.</h2>
      <div class="field"><label>Username</label><input class="input" name="username" value="admin" required></div>
      <div class="field"><label>Password</label><input class="input" type="password" name="password" value="password" required></div>
      <button class="primary" type="submit">Sign in</button>
      <small style="color:#86868b">Any credentials work in this prototype.</small>
    </form>
  </div>
</section>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span class="mark">運</span>Hakobi</div>
    <nav class="nav" id="nav"></nav>
    <div class="profile">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800">A</span>
        <div><b id="user-label">admin</b><div style="font-size:10px;color:#86868b">console.glicc.id</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <span style="display:flex;align-items:center;gap:5px;font-size:10px;color:#86868b"><span class="dot"></span>Online</span>
        <button class="btn" data-action="logout">Sign out</button>
      </div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
const state={
  user:null, page:"overview",
  providers:[
    {id:"local",name:"Local host",endpoint:"agent://local",enabled:true,status:"ok",error:""},
    {id:"staging",name:"Staging VPS",endpoint:"https://staging-agent.example.com",enabled:true,status:"ok",error:""}
  ],
  stacks:[
    {id:"st-1",name:"frontend",providerId:"local",kind:"compose",source:"./frontend",yaml:"services:\n  web:\n    image: nginx:latest\n  api:\n    image: node:22-alpine"}
  ],
  containers:[
    {providerId:"local",name:"gliccops-web",image:"nginx:latest",state:"running",health:"healthy",project:"frontend",service:"web",port:8080},
    {providerId:"local",name:"gliccops-api",image:"node:22-alpine",state:"running",health:"healthy",project:"frontend",service:"api",port:8081},
    {providerId:"local",name:"hakobi-z9pe",image:"hakobi:latest",state:"running",health:"healthy",project:"",service:"",port:3000}
  ],
  hosts:[
    {id:"host-1",name:"Staging VPS",url:"https://staging-agent.example.com",token:"sample-token-0123456789",enabled:true,status:"ok",error:"",lastChecked:new Date().toLocaleTimeString()}
  ],
  metrics:{
    cpu:18.4, cores:[32,18,12,41,9,22,15,28,44,11,6,17,27,8,14,35,21,13,5,19,25,10,3,16,7,12,23,6,18,11,4,9],
    load:[0.42,0.38,0.31], memUsed:66.7, memTotal:125.8, memPercent:53,
    diskUsed:137, diskTotal:942, diskPercent:16,
    netRx:892, netTx:348, netUnit:"MB/s",
    processes:[
      {pid:2134389,command:"llama-server",cpu:4.6,mem:1.9},
      {pid:2136749,command:"user-session",cpu:23.5,mem:0.0},
      {pid:2136729,command:"systemd",cpu:20.0,mem:0.0},
      {pid:2136835,command:"xdg-permission",cpu:1.0,mem:0.0},
      {pid:2136721,command:"sshd",cpu:1.0,mem:0.0}
    ]
  },
  resourceHost:"local"
};
const nav=[
  {key:"overview",label:"Overview"},
  {key:"stacks",label:"Stacks"},
  {key:"stack-form",label:"Stack form",hidden:true,parent:"stacks"},
  {key:"stack-detail",label:"Stack detail",hidden:true,parent:"stacks"},
  {key:"containers",label:"Containers"},
  {key:"container-form",label:"Container form",hidden:true,parent:"containers"},
  {key:"infrastructure",label:"Infrastructure"},
  {key:"providers",label:"Providers"},
  {key:"deployment",label:"Deployment"},
  {key:"resources",label:"Host resources"}
];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+"-"+Math.random().toString(16).slice(2,8);
const provider=id=>state.providers.find(p=>p.id===id);
const providerName=id=>provider(id)?.name??id;
const running=()=>state.containers.filter(c=>c.state==="running");
const stack=id=>state.stacks.find(s=>s.id===id);
const host=id=>state.hosts.find(h=>h.id===id);

function render(){
  $("#login").classList.toggle("hidden",!!state.user);
  $("#app").classList.toggle("hidden",!state.user);
  if(!state.user)return;
  $("#user-label").textContent=state.user;
  $("#nav").innerHTML=nav.filter(n=>!n.hidden).map(n=>`
    <button class="${state.page===n.key?"active":""}" data-action="nav" data-page="${n.key}">
      <span class="ico">◆</span>${esc(n.label)}
    </button>`).join("");
  $("#main").innerHTML=(pages[state.page]||pages.overview)();
}

const art={services:"../static/assets/art/3d/stack-compose.webp",containers:"../static/assets/art/3d/container-image.webp",memory:"../static/assets/art/3d/metrics.webp",cpu:"../static/assets/art/3d/health.webp",disk:"../static/assets/art/3d/backup.webp",network:"../static/assets/art/3d/tunnel.webp",docker:"../static/assets/art/3d/deploy.webp",compose:"../static/assets/art/3d/stack-compose.webp",k8s:"../static/assets/art/3d/domain.webp",nix:"../static/assets/art/3d/source-repo.webp",runner:"../static/assets/art/3d/build-runner.webp"};

function metricCard(label,value,sub,image,percent){
  return `<a class="card" data-action="nav" data-page="${label==="Running services"?"containers":label==="Active containers"?"containers":"resources"}">
    <div class="metric-head"><div><label>${esc(label)}</label><div class="value">${esc(value)}</div></div><img class="art" src="${image}" alt=""></div>
    ${percent!=null?`<div class="bar"><span style="width:${percent}%"></span></div>`:""}
    <div class="sub">${esc(sub)}</div></a>`;
}

function statusTag(status){
  const map={running:["Running",""],healthy:["Healthy",""],stopped:["Stopped","warn"],failed:["Failed","bad"]};
  return `<span class="tag ${map[status]?.[1]??""}">${esc(status)}</span>`;
}

const pages={
 overview(){
   const runningCount=running().length;
   return `
   <div class="top"><div><p class="eyebrow">Overview</p><h1>Good to see you, ${esc(state.user)}.</h1>
   <p class="sub">Control-plane workload status. Host-level detail lives in Infrastructure.</p></div>
   <div class="row"><span class="chip sample">Sample data</span><span class="chip"><span class="dot"></span>Control plane online</span></div></div>
   <div class="grid metrics">
     ${metricCard("Running services",runningCount+" Running","Across 1 stack",art.services)}
     ${metricCard("Active containers",runningCount+" / "+state.containers.length+" Healthy","0 restarting · "+state.containers.length+" total",art.containers)}
     ${metricCard("Memory",state.metrics.memUsed+" GB / "+state.metrics.memTotal+" GB",state.metrics.memPercent+"% used",art.memory,state.metrics.memPercent)}
     ${metricCard("CPU load",state.metrics.cpu+"%","Load "+state.metrics.load.join(" / "),art.cpu)}
   </div>
   <section class="card"><div class="spread"><div><b>Workloads</b><div class="sub">Provider-backed containers</div></div><button class="btn" data-action="nav" data-page="containers">Open containers</button></div>
   <table class="table"><thead><tr><th>Container</th><th>Provider</th><th>Stack</th><th>State</th></tr></thead><tbody>
   ${state.containers.map(c=>`<tr><td class="strong">${esc(c.name)}</td><td>${esc(providerName(c.providerId))}</td><td>${esc(c.project||"standalone")}</td><td>${statusTag(c.state)}</td></tr>`).join("")}
   </tbody></table></section>`;
 },
 stacks(){
   return `
   <div class="page-head"><div><p class="eyebrow">Stacks</p><h1>Stacks.</h1></div><button class="btn brand" data-action="nav" data-page="stack-form">New stack</button></div>
   ${state.stacks.length?`<section class="card"><table class="table"><thead><tr><th>Name</th><th>Provider</th><th>Kind</th><th>Actions</th></tr></thead><tbody>
   ${state.stacks.map(s=>`<tr><td class="strong">${esc(s.name)}</td><td>${esc(providerName(s.providerId))}</td><td>${esc(s.kind)}</td>
   <td><div class="actions"><button class="btn" data-action="stack-detail" data-id="${s.id}">Open</button><button class="btn" data-action="stack-edit" data-id="${s.id}">Edit</button><button class="btn danger" data-action="stack-delete" data-id="${s.id}">Delete</button></div></td></tr>`).join("")}
   </tbody></table></section>`:`<div class="empty">No stacks yet.</div>`}`;
 },
 "stack-form"(){
   const editing=state.editingStackId?stack(state.editingStackId):null;
   return `
   <a class="back" data-action="nav" data-page="stacks">← Stacks</a>
   <div class="page-head"><div><p class="eyebrow">Stacks</p><h1>${editing?"Edit stack":"New stack"}.</h1></div></div>
   <form class="card form-card" data-form="save-stack">
     <div class="form-grid">
       <div class="field"><label>Kind</label><select class="input" name="kind"><option value="compose" selected>compose</option><option value="build">build</option></select></div>
       <div class="field"><label>Provider</label><select class="input" name="providerId">${state.providers.map(p=>`<option value="${p.id}" ${editing?.providerId===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>
       <div class="field"><label>Name</label><input class="input" name="name" value="${esc(editing?.name??"")}" required></div>
       <div class="field"><label>Source</label><input class="input" name="source" value="${esc(editing?.source??"./")}" required></div>
       <div class="field full"><label>Compose YAML</label><textarea class="input" name="yaml">${esc(editing?.yaml??"")}</textarea></div>
     </div>
     <div class="row" style="margin-top:14px"><button class="btn brand" type="submit">Save stack</button><button class="btn" type="button" data-action="nav" data-page="stacks">Cancel</button></div>
   </form>`;
 },
 "stack-detail"(){
   const s=stack(state.selectedStackId);
   if(!s)return pages.stacks();
   return `
   <a class="back" data-action="nav" data-page="stacks">← Stacks</a>
   <div class="page-head"><div><p class="eyebrow">Stack</p><h1>${esc(s.name)}.</h1></div>
   <div class="actions"><button class="btn" data-action="stack-edit" data-id="${s.id}">Edit</button><button class="btn danger" data-action="stack-delete" data-id="${s.id}">Delete</button></div></div>
   <div class="grid two">
     <div class="card"><label style="font-size:10px;font-weight:800;color:#86868b">DETAILS</label>
       <div class="grid" style="gap:8px;margin-top:10px">
         <div class="spread"><span style="color:#86868b">Provider</span><b>${esc(providerName(s.providerId))}</b></div>
         <div class="spread"><span style="color:#86868b">Kind</span><b>${esc(s.kind)}</b></div>
         <div class="spread"><span style="color:#86868b">Source</span><b>${esc(s.source)}</b></div>
       </div></div>
     <div class="card"><label style="font-size:10px;font-weight:800;color:#86868b">COMPOSE YAML</label><pre style="white-space:pre-wrap;margin:10px 0 0;background:#f5f5f7;padding:12px;border-radius:8px">${esc(s.yaml)}</pre></div>
   </div>`;
 },
 containers(){
   return `
   <div class="page-head"><div><p class="eyebrow">Containers</p><h1>Containers.</h1></div><button class="btn brand" data-action="nav" data-page="container-form">Run container</button></div>
   <section class="card"><table class="table"><thead><tr><th>Name</th><th>Provider</th><th>Image</th><th>Port</th><th>State</th><th>Actions</th></tr></thead><tbody>
   ${state.containers.map(c=>`<tr><td class="strong">${esc(c.name)}</td><td>${esc(providerName(c.providerId))}</td><td>${esc(c.image)}</td><td class="num">${esc(c.port)}</td><td>${statusTag(c.state)}</td>
   <td><div class="actions"><button class="btn" data-action="container-restart" data-id="${c.name}">Restart</button><button class="btn danger" data-action="container-delete" data-id="${c.name}">Delete</button></div></td></tr>`).join("")}
   </tbody></table></section>`;
 },
 "container-form"(){
   return `
   <a class="back" data-action="nav" data-page="containers">← Containers</a>
   <div class="page-head"><div><p class="eyebrow">Containers</p><h1>Run container.</h1></div></div>
   <form class="card form-card" data-form="save-container">
     <div class="form-grid">
       <div class="field"><label>Provider</label><select class="input" name="providerId">${state.providers.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div>
       <div class="field"><label>Image</label><input class="input" name="image" value="nginx:latest" required></div>
       <div class="field"><label>Name</label><input class="input" name="name" value="demo-api" required></div>
       <div class="field"><label>Container port</label><input class="input" name="port" type="number" value="8080" required></div>
     </div>
     <div class="row" style="margin-top:14px"><button class="btn brand" type="submit">Run container</button><button class="btn" type="button" data-action="nav" data-page="containers">Cancel</button></div>
   </form>`;
 },
 infrastructure(){
   const cores=state.metrics.cores;
   return `
   <div class="top"><div><p class="eyebrow">Infrastructure</p><h1>Infrastructure.</h1><p class="sub">Host resources from the local agent.</p></div><span class="chip"><span class="dot"></span>Sample data</span></div>
   <div class="grid two">
     <section class="card"><div class="spread"><b>CPU</b><span style="font-size:11px;color:#86868b">${state.metrics.cpu}% · 32 cores</span></div>
       <div class="cores" style="margin-top:12px">${cores.map((p,i)=>`<div class="core"><small>${i}</small><div class="track"><span class="fill" style="height:${p}%"></span></div></div>`).join("")}</div>
       <div class="sub" style="margin-top:10px">Load ${state.metrics.load.join(" / ")}</div></section>
     <section class="card"><div class="spread"><b>Memory</b><span style="font-size:11px;color:#86868b">${state.metrics.memPercent}%</span></div>
       <div class="progress" style="margin-top:12px" value="${state.metrics.memPercent}" max="100"></div>
       <div class="grid two" style="margin-top:12px;font-size:12px"><span>Used <b>${state.metrics.memUsed} GB</b></span><span>Total <b>${state.metrics.memTotal} GB</b></span></div></section>
   </div>
   <div class="grid two" style="margin-top:14px">
     <section class="card"><b>Processes</b><table class="table" style="margin-top:10px"><thead><tr><th>PID</th><th>Command</th><th>CPU</th></tr></thead><tbody>
     ${state.metrics.processes.map(p=>`<tr><td class="strong">${p.pid}</td><td>${esc(p.command)}</td><td class="num">${p.cpu}%</td></tr>`).join("")}
     </tbody></table></section>
     <section class="card"><b>Storage</b><div class="progress" style="margin-top:10px" value="${state.metrics.diskPercent}" max="100"></div>
     <div class="sub">${state.metrics.diskUsed} GB / ${state.metrics.diskTotal} GB · ${state.metrics.diskPercent}% used</div></section>
   </div>`;
 },
 providers(){
   return `
   <div class="top"><div><p class="eyebrow">Providers</p><h1>Providers.</h1><p class="sub">Connect Docker engines to Hakobi.</p></div></div>
   <section class="card" style="margin-bottom:14px"><b>Add Docker provider</b>
    <form class="form-grid" style="margin-top:12px" data-form="add-provider">
      <div class="field"><label>Name</label><input class="input" name="name" required></div>
      <div class="field"><label>Endpoint</label><input class="input" name="endpoint" placeholder="unix:///var/run/docker.sock" required></div>
      <div class="full"><button class="btn brand" type="submit">Add provider</button></div>
    </form></section>
   <section class="card"><table class="table"><thead><tr><th>Name</th><th>Endpoint</th><th>Status</th><th>Actions</th></tr></thead><tbody>
   ${state.providers.map(p=>`<tr><td class="strong">${esc(p.name)}</td><td>${esc(p.endpoint)}</td><td>${p.enabled?`<span class="tag">Enabled</span>`:`<span class="tag warn">Disabled</span>`}</td>
   <td><div class="actions"><button class="btn" data-action="provider-test" data-id="${p.id}">Test</button><button class="btn" data-action="provider-toggle" data-id="${p.id}">${p.enabled?"Disable":"Enable"}</button><button class="btn danger" data-action="provider-delete" data-id="${p.id}">Delete</button></div></td></tr>`).join("")}
   </tbody></table></section>`;
 },
 deployment(){
   return `
   <div class="top"><div><p class="eyebrow">Deployment</p><h1>Deployment.</h1><p class="sub">Register remote agents that Hakobi can inspect and operate.</p></div></div>
   <section class="card" style="margin-bottom:14px"><b>Register a remote agent</b>
    <form class="form-grid" style="margin-top:12px" data-form="add-host">
      <div class="field"><label>Name</label><input class="input" name="name" required></div>
      <div class="field"><label>Agent URL</label><input class="input" name="url" placeholder="https://agent.example.com" required></div>
      <div class="field"><label>Bearer token</label><input class="input" name="token" required></div>
      <div class="full"><button class="btn brand" type="submit">Register host</button></div>
    </form></section>
   ${state.hosts.map(h=>`<section class="card" style="margin-bottom:10px"><div class="spread"><div><b>${esc(h.name)}</b><div class="sub">${esc(h.url)}</div></div>
   <span class="tag ${h.enabled?"":"warn"}">${h.enabled?"Enabled":"Disabled"}</span></div>
   <div class="actions" style="margin-top:10px"><button class="btn" data-action="host-resources" data-id="${h.id}">Resources</button><button class="btn" data-action="host-test" data-id="${h.id}">Test</button><button class="btn" data-action="host-toggle" data-id="${h.id}">${h.enabled?"Disable":"Enable"}</button><button class="btn danger" data-action="host-delete" data-id="${h.id}">Delete</button></div></section>`).join("")}`;
 },
 resources(){
   const h=host(state.resourceHost)||state.hosts[0];
   return `
   <a class="back" data-action="nav" data-page="deployment">← Deployment</a>
   <div class="top"><div><p class="eyebrow">Hosts / ${esc(h?.name??"")}</p><h1>Host resources.</h1></div><span class="chip"><span class="dot"></span>Live · 5s</span></div>
   <div class="grid metrics">
     ${metricCard("CPU",state.metrics.cpu+"%","Load "+state.metrics.load.join(" / "),art.cpu)}
     ${metricCard("Memory",state.metrics.memUsed+" GB / "+state.metrics.memTotal+" GB",state.metrics.memPercent+"% used",art.memory,state.metrics.memPercent)}
     ${metricCard("Disk",state.metrics.diskUsed+" GB / "+state.metrics.diskTotal+" GB",state.metrics.diskPercent+"% used",art.disk,state.metrics.diskPercent)}
     ${metricCard("Network",state.metrics.netRx+" MB/s","TX "+state.metrics.netTx+" MB/s",art.network)}
   </div>
   <div class="grid two">
     <section class="card"><b>CPU cores</b><div class="cores" style="margin-top:12px">${state.metrics.cores.map((p,i)=>`<div class="core"><small>${i}</small><div class="track"><span class="fill" style="height:${p}%"></span></div></div>`).join("")}</div></section>
     <section class="card"><b>Processes</b><table class="table" style="margin-top:10px"><thead><tr><th>PID</th><th>Command</th><th>CPU</th></tr></thead><tbody>
     ${state.metrics.processes.map(p=>`<tr><td class="strong">${p.pid}</td><td>${esc(p.command)}</td><td class="num">${p.cpu}%</td></tr>`).join("")}
     </tbody></table></section>
   </div>`;
 }
};

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");
  if(!el)return;
  const action=el.dataset.action,id=el.dataset.id;
  if(action==="logout"){state.user=null;state.page="overview";render();}
  if(action==="nav"){state.page=id;render();}
  if(action==="stack-detail"){state.selectedStackId=id;state.page="stack-detail";render();}
  if(action==="stack-edit"){state.editingStackId=id;state.page="stack-form";render();}
  if(action==="stack-delete"){state.stacks=state.stacks.filter(s=>s.id!==id);render();}
  if(action==="container-delete"){state.containers=state.containers.filter(c=>c.name!==id);render();}
  if(action==="container-restart"){const c=state.containers.find(c=>c.name===id);if(c){c.state="running";c.health="healthy"}render();}
  if(action==="provider-toggle"){const p=provider(id);if(p)p.enabled=!p.enabled;render();}
  if(action==="provider-delete"){state.providers=state.providers.filter(p=>p.id!==id);render();}
  if(action==="provider-test"){const p=provider(id);if(p){p.status="ok";p.error=""}render();}
  if(action==="host-toggle"){const h=host(id);if(h)h.enabled=!h.enabled;render();}
  if(action==="host-delete"){state.hosts=state.hosts.filter(h=>h.id!==id);render();}
  if(action==="host-test"){const h=host(id);if(h){h.status="ok";h.error="";h.lastChecked=new Date().toLocaleTimeString()}render();}
  if(action==="host-resources"){state.resourceHost=id;state.page="resources";render();}
});

document.addEventListener("submit",e=>{
  const form=e.target.closest("form[data-form]");
  if(!form)return;
  e.preventDefault();
  const data=Object.fromEntries(new FormData(form));
  const kind=form.dataset.form;
  if(kind==="login"){state.user=data.username||"admin";state.page="overview";render();return;}
  if(kind==="save-stack"){
    if(state.editingStackId){const s=stack(state.editingStackId);Object.assign(s,{name:data.name,providerId:data.providerId,kind:data.kind,source:data.source,yaml:data.yaml});state.editingStackId=null;}
    else state.stacks.push({id:uid("st"),name:data.name,providerId:data.providerId,kind:data.kind,source:data.source,yaml:data.yaml});
    state.page="stacks";render();return;
  }
  if(kind==="save-container"){
    state.containers.push({providerId:data.providerId,name:data.name,image:data.image,port:Number(data.port),state:"running",health:"healthy",project:"",service:""});
    state.page="containers";render();return;
  }
  if(kind==="add-provider"){
    const id=uid("prov");
    state.providers.push({id,name:data.name,endpoint:data.endpoint,enabled:true,status:"ok",error:""});
    state.page="providers";render();return;
  }
  if(kind==="add-host"){
    const id=uid("host");
    state.hosts.push({id,name:data.name,url:data.url,token:data.token,enabled:true,status:"ok",error:"",lastChecked:"never"});
    state.page="deployment";render();return;
  }
});

const url=new URLSearchParams(location.search);
if(url.get("page"))state.page=url.get("page");
if(url.has("login"))state.user=url.get("login")||"admin";
render();
</script>
</body>
</html>
